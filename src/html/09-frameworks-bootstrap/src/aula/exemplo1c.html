<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Grid Avançado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-4 col-md-3 bg-primary text-white p-3">Coluna 1 (sm:4/12, md:3/12)</div>
            <div class="col-sm-8 col-md-9 bg-secondary text-white p-3">Coluna 2 (sm:8/12, md:9/12)</div>
        </div>
        <div class="row mt-3">
            <div class="col-lg-6 bg-primary text-white p-3">Coluna 1 (lg:6/12)</div>
            <div class="col-lg-6 bg-secondary text-white p-3">Coluna 2 (lg:6/12)</div>
        </div>
        <div class="row mt-3">
            <div class="col-xl-4 bg-primary text-white p-3">Coluna 1 (xl:4/12)</div>
            <div class="col-xl-8 bg-secondary text-white p-3">Coluna 2 (xl:8/12)</div>
        </div>
    </div>
</html>
