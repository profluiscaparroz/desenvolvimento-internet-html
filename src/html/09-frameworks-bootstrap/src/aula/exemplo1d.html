<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uso de botões</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container mt-5">
            <h1 class="mb-4">Exemplo de Botões com Bootstrap</h1>
            <button class="btn btn-primary">Primário</button>
            <button class="btn btn-success">Sucesso</button>
            <button class="btn btn-danger">Perigo</button>
            <button class="btn btn-warning">Alerta</button>
            <button class="btn btn-info">Informação</button>
            <button class="btn btn-secondary">Secundário</button>

            <!-- Botões de tamanho diferente -->
            <div class="mt-4">
                <button class="btn btn-primary btn-sm">Pequeno</button>
                <button class="btn btn-primary btn-lg">Grande</button>
                <button class="btn btn-outline-primary">Estilo de entorno</button>
            </div>
        </div>
    </body>
</html>
