<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uso de margin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="mt-5 border">Margem superior de 3rem (48px)</div>
        <div class="mb-3 border">Margem inferior de 1rem (16px)</div>
        <div class="px-4 border">Padding lateral (esquerda/direita) de 1.5rem</div>
        <div class="py-2 border">Padding vertical (top/bottom) de 0.5rem</div>
    </body>
</html>
