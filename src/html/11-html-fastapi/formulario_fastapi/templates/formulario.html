<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center mb-4">Cadastro de Usuário</h1>

    <div class="card mx-auto" style="max-width: 400px;">
      <div class="card-body">
        <form action="/enviar" method="post">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail:</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="idade" class="form-label">Idade:</label>
            <input type="number" id="idade" name="idade" class="form-control" min="1" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>

        {% if mensagem %}
          <div class="alert alert-success mt-3" role="alert">
            {{ mensagem }}
          </div>
        {% endif %}
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="/" class="btn btn-link">🏠 Voltar à Página Inicial</a>
      <a href="/usuarios" class="btn btn-link">Ver lista de usuários</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
