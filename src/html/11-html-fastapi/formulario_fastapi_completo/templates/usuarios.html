<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários Cadastrados</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f0f0f0; }
        .actions { display: flex; gap: 8px; }
        .btn { padding: 6px 10px; border-radius: 6px; text-decoration: none; color: white; border: none; cursor: pointer; }
        .btn-edit { background: #007bff; }
        .btn-delete { background: #dc3545; }
        a.home { display: inline-block; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>Usuários Cadastrados</h1>

    <a class="home" href="/">🏠 Voltar à Página Inicial</a>
    <a href="/formulario">➕ Cadastrar Novo Usuário</a>

    <br><br>

    {% if usuarios %}
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Idade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ u.nome }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.idade }}</td>
                <td>
                    <div class="actions">
                        <a class="btn btn-edit" href="/usuario/{{ loop.index0 }}/editar">Editar</a>

                        <!-- formulário de delete via POST -->
                        <form method="post" action="/usuario/{{ loop.index0 }}/deletar" onsubmit="return confirm('Tem certeza que deseja excluir este usuário?');" style="display:inline;">
                            <button type="submit" class="btn btn-delete">Excluir</button>
                        </form>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>Nenhum usuário cadastrado ainda.</p>
    {% endif %}
</body>
</html>
