<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário com action absoluto</title>
</head>
<body>
  <h2>Formulário com action direto</h2>
  <form action="http://localhost:8000/receber" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade" required>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
