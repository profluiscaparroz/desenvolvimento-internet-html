<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulação de GET e POST com JavaScript</title>
  <style>
    body { font-family: Arial; padding: 2rem; }
    input { margin: 0.5rem 0; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Simulação GET</h2>
  <input type="number" id="idade" placeholder="Digite sua idade">
  <button onclick="simularGET()">Enviar GET</button>
  <pre id="resultadoGET">Resultado GET aqui...</pre>

  <h2>Simulação POST</h2>
  <input type="text" id="nome" placeholder="Digite seu nome">
  <input type="number" id="idadePost" placeholder="Digite sua idade">
  <button onclick="simularPOST()">Enviar POST</button>
  <pre id="resultadoPOST">Resultado POST aqui...</pre>

  <script>
    // Função para simular um GET
    function simularGET() {
      const idade = document.getElementById("idade").value;
      if (idade === "") {
        alert("Por favor, insira uma idade.");
        return;
      }

      // Simulando a resposta do GET
      const resultado = [];
      for (let i = idade; i >= 0; i--) {
        resultado.push(i);
      }

      // Mostra o resultado da simulação GET
      document.getElementById("resultadoGET").innerText = JSON.stringify({ valores: resultado }, null, 2);
    }

    // Função para simular um POST
    function simularPOST() {
      const nome = document.getElementById("nome").value;
      const idade = parseInt(document.getElementById("idadePost").value);

      if (!nome || !idade) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      // Simulando um POST com armazenamento local (localStorage)
      const pessoa = { nome, idade };

      // Armazenando no localStorage
      localStorage.setItem("pessoa", JSON.stringify(pessoa));

      // Simulando a resposta do POST
      const respostaPOST = { mensagem: `Olá ${nome}, você tem ${idade} anos!` };

      // Mostra o resultado da simulação POST
      document.getElementById("resultadoPOST").innerText = JSON.stringify(respostaPOST, null, 2);
    }
  </script>

</body>
</html>
