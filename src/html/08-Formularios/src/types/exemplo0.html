<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tipos de Input</title>
</head>
<body>
    <h1>Exemplo de Diversos Tipos de Input</h1>
    <form>
        <label for="text">Texto:</label>
        <input type="text" id="text" name="text"><br><br>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="number">Número:</label>
        <input type="number" id="number" name="number"><br><br>

        <label for="date">Data:</label>
        <input type="date" id="date" name="date"><br><br>

        <label for="color">Cor:</label>
        <input type="color" id="color" name="color"><br><br>

        <label for="file">Arquivo:</label>
        <input type="file" id="file" name="file"><br><br>

        <label for="checkbox">Checkbox:</label>
        <input type="checkbox" id="checkbox" name="checkbox"><br><br>

        <label for="radio1">Opção 1:</label>
        <input type="radio" id="radio1" name="radio"><br>
        <label for="radio2">Opção 2:</label>
        <input type="radio" id="radio2" name="radio"><br><br>

        <label for="range">Range:</label>
        <input type="range" id="range" name="range" min="0" max="100"><br><br>

        <label for="tel">Telefone:</label>
        <input type="tel" id="tel" name="tel"><br><br>

        <label for="url">URL:</label>
        <input type="url" id="url" name="url"><br><br>

        <label for="search">Busca:</label>
        <input type="search" id="search" name="search"><br><br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
