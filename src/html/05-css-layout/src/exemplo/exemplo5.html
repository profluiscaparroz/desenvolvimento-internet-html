<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipos de Borda</title>
<style>
  .caixa {
    width: 150px;
    height: 80px;
    margin: 10px;
    padding: 10px;
    text-align: center;
    line-height: 60px;
    background-color: #f39c12;
    color: white;
    display: inline-block;
  }

  .solid { border: 4px solid #2c3e50; }
  .dashed { border: 4px dashed #2c3e50; }
  .dotted { border: 4px dotted #2c3e50; }
  .double { border: 6px double #2c3e50; }
  .groove { border: 4px groove #2c3e50; }
  .ridge { border: 4px ridge #2c3e50; }
  .inset { border: 4px inset #2c3e50; }
  .outset { border: 4px outset #2c3e50; }
  .none { border: none; }
</style>
</head>
<body>

<h1>Tipos de Borda</h1>

<div class="caixa solid">Solid</div>
<div class="caixa dashed">Dashed</div>
<div class="caixa dotted">Dotted</div>
<div class="caixa double">Double</div>
<div class="caixa groove">Groove</div>
<div class="caixa ridge">Ridge</div>
<div class="caixa inset">Inset</div>
<div class="caixa outset">Outset</div>
<div class="caixa none">None</div>

<p>
💡 Use diferentes tipos de borda para **destacar elementos** ou criar efeitos visuais.  
A espessura (`border-width`) e a cor (`border-color`) podem ser combinadas com qualquer tipo.
</p>

</body>
</html>
