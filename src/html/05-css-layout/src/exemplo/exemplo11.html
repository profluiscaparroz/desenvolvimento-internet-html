<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo Fixed</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  /* Cabeçalho fixo */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background-color: #3498db;
    color: white;
    text-align: center;
    line-height: 60px;
    font-size: 20px;
    z-index: 1000; /* garante que fique acima de outros elementos */
  }

  /* Conteúdo da página */
  .content {
    margin-top: 70px; /* espaço para o header fixo */
    padding: 20px;
  }

  .section {
    height: 400px;
    background-color: #f39c12;
    margin-bottom: 20px;
    color: white;
    text-align: center;
    line-height: 400px;
    font-size: 24px;
  }
</style>
</head>
<body>

<div class="header">Cabeçalho Fixo (Fixed)</div>

<div class="content">
  <div class="section">Seção 1</div>
  <div class="section">Seção 2</div>
  <div class="section">Seção 3</div>
</div>

</body>
</html>
