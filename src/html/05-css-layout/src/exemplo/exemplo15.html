<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo Flex Shrink</title>
<style>
.container {
  display: flex;
  width: 300px; /* espaço limitado */
  border: 2px dashed #ccc;
  padding: 10px;
}

.item {
  background-color: #3498db;
  color: white;
  text-align: center;
  line-height: 50px;
  margin: 5px;
  width: 150px; /* largura inicial maior que o contêiner */
  height: 50px;
}

/* flex-shrink diferente para cada item */
.item1 { flex-shrink: 1; }  /* encolhe normalmente */
.item2 { flex-shrink: 2; }  /* encolhe mais rápido */
.item3 { flex-shrink: 0; }  /* não encolhe */
</style>
</head>
<body>

<h1>Exemplo de Flex Shrink</h1>

<div class="container">
  <div class="item item1">1</div>
  <div class="item item2">2</div>
  <div class="item item3">3</div>
</div>

<p>
O contêiner tem **menos espaço que a soma das larguras**.  
- Item 1 encolhe normalmente  
- Item 2 encolhe mais rápido  
- Item 3 **não encolhe**
</p>

</body>
</html>
