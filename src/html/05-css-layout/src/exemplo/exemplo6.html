<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margin em cada lado</title>
<style>
  .caixa {
    width: 150px;
    height: 80px;
    background-color: #4a90e2;
    color: white;
    text-align: center;
    line-height: 80px;
    display: inline-block;
  }

  /* Margin superior */
  .top {
    margin-top: 30px;
  }

  /* Margin direita */
  .right {
    margin-right: 30px;
  }

  /* Margin inferior */
  .bottom {
    margin-bottom: 30px;
  }

  /* Margin esquerda */
  .left {
    margin-left: 30px;
  }

  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
</style>
</head>
<body>

<h1>Margin individual em cada lado</h1>

<div class="caixa top">Margin Top</div>
<div class="caixa right">Margin Right</div>
<div class="caixa bottom">Margin Bottom</div>
<div class="caixa left">Margin Left</div>

<p>
Cada caixa tem apenas uma margem ativa** em um dos lados, mostrando como a margem cria espaço externo.
</p>

</body>
</html>
