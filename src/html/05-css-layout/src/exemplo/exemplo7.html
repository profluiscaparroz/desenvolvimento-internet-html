<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Box Model Completo</title>
    </head>
    <body>
        <style>
            .static { position: static; background: #3498db; }
            .relative { position: relative; top: 20px; left: 20px; background: #2ecc71; }
            .absolute { position: absolute; top: 50px; left: 50px; background: #e74c3c; }
            .fixed { position: fixed; top: 10px; right: 10px; background: #f39c12; }
            .sticky-container { height: 200px; border: 1px solid #ccc; }
            .sticky { position: sticky; top: 0; background: #9b59b6; }
            
            div {
              width: 100px;
              height: 50px;
              color: white;
              text-align: center;
              line-height: 50px;
              margin: 10px;
            }
          </style>
          
          <div class="static">Static</div>
          <div class="relative">Relative</div>
          <div class="absolute">Absolute</div>
          <div class="fixed">Fixed</div>
          
          <div class="sticky-container">
            <div class="sticky">Sticky</div>
          </div>
          
    </body>
</html>
