<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Industrial</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            Truck Analytics
        </div>

        <nav class="menu">
            <a href="#">Dashboard</a>
            <a href="#">Motores</a>
            <a href="#">Alertas</a>
            <a href="#">Relatórios</a>
        </nav>

        <div class="user">
            Luis
        </div>

    </header>

    <main class="container">

        <h1>Dashboard de Monitoramento</h1>

        <!-- CARDS KPI -->
        <section class="cards">

            <div class="card">
                <h2>RPM</h2>
                <p>2.340</p>
            </div>

            <div class="card">
                <h2>Temperatura</h2>
                <p>91°C</p>
            </div>

            <div class="card">
                <h2>Pressão</h2>
                <p>38 PSI</p>
            </div>

            <div class="card">
                <h2>Alertas</h2>
                <p>2 ativos</p>
            </div>

        </section>

        <!-- DASHBOARD -->
        <section class="dashboard">

            <div class="panel">
                <h2>Caminhões Conectados</h2>
                <p>38 ativos</p>
            </div>

            <div class="panel">
                <h2>Telemetria</h2>
                <p>Streaming MQTT em tempo real</p>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <div>
            © 2026 Truck Analytics
        </div>

        <div>
            Monitoramento Industrial IoT
        </div>

    </footer>

</body>
</html>
